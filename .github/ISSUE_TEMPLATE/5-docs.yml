name: Documentation
description: Add, remove or edit documents
title: "docs: "
labels:
  - docs
body:
  - type: textarea
    id: notice
    attributes:
      label: Notice
      description: The issue title and commit message affect the changelog. Read before submitting.
      value: |
        Craft the title in one of the following formats:

        - `docs: <description>`

        When committing code locally, execute `git commit -m "<crafted title>" -m "Closes #<issue number>"`

        Useful guides:
        - [How to make code changes](https://github.com/marketsentinel/library/wiki/guide_how-to-make-code-changes)

  - type: textarea
    id: document-locations
    attributes:
      label: Document locations
      description: Provide the file paths, wiki pages or URLs of the documents.
      value: |
        - <document name>: <file path, wiki page or URL>
    validations:
      required: true

  - type: textarea
    id: requirement
    attributes:
      label: Requirement
      description: Describe what is missing, wrong or unclear.
      value: |
        - <document name>: <add, remove or edit> <what is missing, wrong or unclear, and what it should say>
    validations:
      required: true
