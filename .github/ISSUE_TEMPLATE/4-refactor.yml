name: Refactor
description: Restructure code without changing behaviour
title: "refactor: "
labels:
  - refactor
body:
  - type: textarea
    id: notice
    attributes:
      label: Notice
      description: The issue title and commit message affect automated versioning. Read before submitting.
      value: |
        Craft the title in one of the following formats:

        - `refactor: <description>`
        - `refactor!: <description>` if it is a breaking change

        When committing code locally, execute `git commit -m "<crafted title>" -m "Resolves #<issue number>"`

        Useful guides:
        - [How to make code changes](https://github.com/marketsentinel/library/wiki/guide_how-to-make-code-changes)

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong with the current structure, and why does it need to change?
      value: |
        **What is wrong:** <e.g. duplication, tight coupling, unclear naming, hard to test>
        **Why change now:** <what it blocks or slows down, e.g. upcoming feature, recurring bugs, onboarding>
    validations:
      required: true

  - type: textarea
    id: current-structure
    attributes:
      label: Current structure
      description: Describe how the code is structured now.
      value: |
        **Affected code:** <modules, files or classes involved>
        **How it works now:** <one or two sentences on how the pieces fit together>
    validations:
      required: true

  - type: textarea
    id: target-structure
    attributes:
      label: Target structure
      description: Describe how you will restructure the code.
      value: |
        **How it will work:** <one or two sentences on the new arrangement>

        **Changes:**
        - <module, file or class affected and what changes>

        **Approach:** <single change or staged steps, e.g. extract, move callers, delete old code>
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Risk
      description: Describe what could break and how you will confirm behaviour is unchanged.
      value: |
        **What could break:** <callers, integrations, data or deployments at risk>
        **Behaviour check:** <how you will confirm behaviour is unchanged, e.g. existing tests, new characterisation tests, diff of outputs>
        **Rollback:** <how to undo if something goes wrong, or 'Revert the PR'>
    validations:
      required: true

  - type: textarea
    id: breaking-change-details
    attributes:
      label: Breaking change details
      description: Required if the title includes `!`. Describe what breaks and how users should migrate.
      value: |
        **What breaks:** <API, config, behaviour or data format>
        **Who is affected:** <users, services or downstream repos>
        **Migration:** <steps users must take to upgrade>
    validations:
      required: false
