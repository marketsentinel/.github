name: Fix
description: Fix a bug
title: "fix: "
labels:
  - fix
body:
  - type: textarea
    id: notice
    attributes:
      label: Notice
      description: The issue title and commit message affect automated versioning. Read before submitting.
      value: |
        Craft the title in one of the following formats:

        - `fix: <description>`
        - `fix!: <description>` if it is a breaking change

        When committing code locally, execute `git commit -m "<crafted title>" -m "Fixes #<issue number>"`

        Useful guides:
        - [How to make code changes](https://github.com/marketsentinel/library/wiki/guide_how-to-make-code-changes)

  - type: textarea
    id: current-behaviour
    attributes:
      label: Current behaviour
      description: Describe what currently happens, include any error messages or logs.
      value: |
        **What happens:** <what you observe>

        **Error / logs:**
        ```
        <paste error messages or log output, or 'None'>
        ```

        **Impact:** <who or what is affected, and how often it happens>
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected behaviour
      description: Describe what should happen instead.
      value: |
        **Expected:** <what should happen>

        **Reference:** <spec, docs or previous behaviour that defines this, or 'None'>
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the bug. If the fix is simple and not breaking, replace the template with 'This is a simple fix, no details required'.
      value: |
        1. <step>
        2. <step>
        3. <step where the bug appears>
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Describe where the bug occurs, such as the branch, workflow run, AWS account or region. If the fix is simple and not breaking, replace the template with 'This is a simple fix, no details required'.
      value: |
        **Branch / version:** <branch, tag or commit>
        **Workflow run:** <URL, if applicable>
        **AWS account / region:** <account alias and region, if applicable>
    validations:
      required: true

  - type: textarea
    id: proposed-fix
    attributes:
      label: Proposed fix
      description: Describe the fix you will make. If the fix is simple and not breaking, replace the template with 'This is a simple fix, no details required'.
      value: |
        **Root cause:** <why the bug happens, if known>
        **Approach:** <one or two sentences on how you will fix it>
        **Changes:** <module, file or API affected and what changes>
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List the conditions that must be met for this fix to be complete. Mark `[x]` when a condition is met. If the fix is simple and not breaking, replace the template with 'This is a simple fix, no details required'.
      value: |
        - [ ] Given <context>, when <action>, then <expected result>
        - [ ] A test reproduces the bug and passes with the fix
    validations:
      required: true

  - type: textarea
    id: breaking-change-details
    attributes:
      label: Breaking change details
      description: Required if the title includes `!`. Describe what breaks and how users should migrate.
      value: |
        **What breaks:** <API, config, behaviour or data format>
        **Who is affected:** <users, services or downstream repos>
        **Migration:** <steps users must take to upgrade>
    validations:
      required: false
